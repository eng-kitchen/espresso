name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test installer scripts
        run: make test-installer

      - name: Build app
        run: make build

      - name: Sign app (ad-hoc)
        run: |
          codesign --sign - --force --deep Espresso.app
          xattr -cr Espresso.app

      - name: Package café DMG
        run: |
          python3 -m pip install --user 'dmgbuild>=1.6.1'
          ./installer/build-dmg.sh Espresso.app "$PWD/Espresso.dmg"
          shasum -a 256 Espresso.dmg | tee Espresso.dmg.sha256

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Espresso.dmg \
            Espresso.dmg.sha256 \
            --title "Espresso $GITHUB_REF_NAME" \
            --notes-file installer/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare landing page
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p _site
          sed "s/{{VERSION}}/$VERSION/g" docs/index.html > _site/index.html
          cp scripts/install.sh _site/install.sh
          chmod 644 _site/install.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy-pages:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
